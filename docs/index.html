<script>
'use strict';
async function init(){
const bytes=Uint8Array.from(atob(document.querySelector('#dataset').textContent),c=>c.charCodeAt(0));
const data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const by=id=>document.getElementById(id);
const variants={base:'Исходное досье',permutation:'Перестановка документов',removal:'Удаление посылки',contradiction:'Добавление противоречия'};
const desc={A:'Весь текст документов',B:'15 утверждений BM25 плоским списком',C:'Те же 15 утверждений по p-adic ветвям'};
const status={entailed:'Подтверждено',contradicted:'Опровергнуто',both:'Есть противоречие',insufficient:'Недостаточно данных'};
let mode='A';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,n=0)=>x==null||x===''?'—':Number(x).toLocaleString('ru-RU',{maximumFractionDigits:n,minimumFractionDigits:n});
const pct=x=>x==null||x===''?'—':num(100*x,1)+'%';
const badge=x=>'<span class="badge">'+esc(status[x]??x)+'</span>';
const details=(name,html)=>'<details><summary>'+esc(name)+'</summary>'+html+'</details>';
for(const q of data.questions) by('q').add(new Option(q.question_id+' · '+q.question,q.question_id));
function options(){
 const last=by('v').value;
 by('v').replaceChildren();
 for(const [key,name] of Object.entries(variants)) if(data.rows[by('q').value][key]) by('v').add(new Option(name,key));
 if([...by('v').options].some(x=>x.value===last))by('v').value=last;
}
function render(){
 const qid=by('q').value,v=by('v').value, rows=data.rows[qid][v], r=rows[mode], a=r.parsed, g=r.gold;
 const snap=data.snapshots[qid+'/'+v], claims=snap.claims;
 const cards=(ids,quote)=>ids?.length?ids.map(id=>{const c=claims[id];return '<div class="item"><strong>'+esc(id)+(c?' · '+esc(c.document_id):'')+'</strong><p>'+esc(c?.[quote?'evidence':'text']??'Утверждение отсутствует в этом досье')+'</p></div>'}).join(''):'<p class="muted">Нет</p>';
 by('result').innerHTML='<section class="panel"><div class="eyebrow">'+esc(qid+' / Режим '+mode)+'</div><h2>'+esc(g.question)+'</h2>'+
 (v==='base'?'':'<p class="muted">Стресс-вариант: ожидаемый статус предварительный.</p>')+
 (a?'<p>'+badge(a.status)+' <small>Уверенность: '+pct(a.confidence)+'</small></p><p>'+esc(a.answer??'Модель не дала однозначного ответа.')+'</p><p class="muted">'+esc(a.explanation)+'</p><div class="grid"><div><h3>Доказательства</h3>'+cards(a.evidence_ids,true)+'</div><div><h3>Контрдоказательства</h3>'+cards(a.counterevidence_ids,true)+'</div></div>':'<p class="invalid"><strong>Ответ не прошёл проверку.</strong> '+esc(r.error)+'</p>')+
 '<p><small>'+num(r.seconds,2)+' с · '+num(r.input_tokens)+' входных и '+num(r.output_tokens)+' выходных токенов</small></p>'+
 details('Эталон', '<p>'+badge(g.gold_status)+' '+esc(g.gold_answer)+'</p><p class="muted">Основания: '+esc(g.gold_evidence_ids?.join(', ')||'—')+' · Контрдоказательства: '+esc(g.gold_counterevidence_ids?.join(', ')||'—')+'</p>')+
 details('Исходный ответ модели','<pre>'+esc(r.raw)+'</pre>')+'</section>';
 by('comparison').innerHTML='<h2>Сравнение режимов</h2><p class="muted">Для выбранного вопроса и сценария</p><div class="scroll"><table><thead><tr><th>Режим</th><th>Ответ модели</th><th>Уверенность</th><th>Токены (вход)</th><th>Время</th></tr></thead><tbody>'+
 Object.entries(rows).map(([m,x])=>'<tr><th scope="row">'+esc(m+' · '+desc[m])+'</th><td>'+(x.parsed?badge(x.parsed.status):'<span class="invalid">Ошибка проверки</span>')+'</td><td>'+pct(x.parsed?.confidence)+'</td><td>'+num(x.input_tokens)+'</td><td>'+num(x.seconds,2)+' с</td></tr>').join('')+
 '</tbody></table></div>'+details('Метрики по всем вопросам сценария','<p class="muted">'+(v==='base'?'Основной эксперимент.':'Предварительная оценка: стресс-варианты не подтверждены участниками.')+'</p><div class="scroll"><table><thead><tr><th>Режим</th><th>Запросов</th><th>Точность статуса</th><th>Evidence F1</th><th>Recall контрдоказательств</th></tr></thead><tbody>'+
 data.metrics.filter(x=>x.variant===v).map(x=>'<tr><th scope="row">'+esc(x.mode)+'</th><td>'+num(x.n)+'</td><td>'+pct(x.status_accuracy)+'</td><td>'+num(x.evidence_f1,3)+'</td><td>'+num(x.counterevidence_recall,3)+'</td></tr>').join('')+'</tbody></table></div>');
 let ctx='';
 if(mode==='A'){
   ctx=r.available_claim_ids?.length+' утверждений в '+snap.docs.length+' документах.';
 } else if(mode==='B'){
   ctx=cards(r.available_claim_ids,false);
 } else {
   const groups={}; for(const id of r.available_claim_ids){const c=claims[id];if(c)(groups[c.padic_path.join(', ')]??=[]).push(id);}
   ctx=Object.keys(groups).sort().map(k=>details('Ветвь ['+k+'] · '+groups[k].length,cards(groups[k].sort((a,b)=>(claims[a].event_time??'~').localeCompare(claims[b].event_time??'~')||a.localeCompare(b)),false))).join('');
 }
 by('context').innerHTML='<h2>Контекст и досье</h2><p class="muted">'+esc(desc[mode])+'</p>'+ctx+
 details('Документы в порядке прогона',snap.docs.map(i=>{const d=data.docs[i];return details(d.document_id+' · '+d.title,'<pre>'+esc(d.text)+'</pre>')}).join(''));
}
by('q').addEventListener('change',()=>{options();render()});
by('v').addEventListener('change',render);
for(const b of by('modes').querySelectorAll('button')) b.addEventListener('click',()=>{
 mode=b.dataset.mode;
 for(const x of by('modes').querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));
 render();
});
options();render();
}
init().catch(()=>{document.querySelector('#result').textContent='Не удалось открыть данные. Попробуйте обновить страницу или использовать современный браузер.'});
</script>
</body>
</html>
